services:
  readeck-tts:
    image: ghcr.io/delete-yourself-today/readeck-tts:latest
    restart: unless-stopped
    environment:
      # Required: instance URLs (without /api) and API tokens.
      READECK_URL: "https://readeck.example.com"
      READECK_API_TOKEN: ""
      AUDIOBOOKSHELF_URL: "https://audiobookshelf.example.com"
      AUDIOBOOKSHELF_API_TOKEN: ""
      # Choose kokoro, elevenlabs, or gemini. Kokoro remains the default.
      # TTS_PROVIDER: "kokoro"
      # Required only for Kokoro: API URL, including /v1.
      KOKORO_BASE_URL: "http://kokoro:8880/v1"

      # Optional: uncomment to override the application defaults.
      # READECK_TAG: "tts"
      # Post-listening actions; set any to "true" to opt in.
      # Use your listening user's ABS token with delete permission if deletion is enabled.
      # ARCHIVE_ON_FINISH: "false"
      # DELETE_AUDIO_ON_FINISH: "false"
      # AUDIOBOOKSHELF_LIBRARY: "Podcasts"
      # AUDIOBOOKSHELF_PODCAST: "Readeck"
      # Set a folder ID only if the library has multiple folders.
      # AUDIOBOOKSHELF_FOLDER_ID: ""
      # KOKORO_API_KEY: ""
      # KOKORO_MODEL: "kokoro"
      # KOKORO_VOICE: "af_heart"
      # Required for ElevenLabs; optional model and voice defaults shown.
      # ELEVENLABS_API_KEY: ""
      # ELEVENLABS_MODEL: "eleven_v4_turbo"
      # ELEVENLABS_VOICE: "JBFqnCBsd6RMkjVDRZzb"
      # Required for Gemini; optional model and voice defaults shown.
      # GEMINI_API_KEY: ""
      # GEMINI_MODEL: "gemini-3.8-flash-lite-tts"
      # GEMINI_VOICE: "Charon"
      # POLL_INTERVAL_SECONDS: "300"
      # RETRY_INTERVAL_SECONDS: "30"
      # TTS_TIMEOUT_SECONDS: "1800"
      # LOG_LEVEL: "INFO"
    volumes:
      - data:/data

volumes:
  data:
